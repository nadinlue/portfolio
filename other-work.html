<style>
*{box-sizing:border-box}
html,body{margin:0;background:#FAF8F4;color:#37263A}
body{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
a{color:#37263A;text-decoration:none}
a:hover{color:#E09723}
header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(250,248,244,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #EAE5DC}
.bar{max-width:1440px;margin:0 auto;padding:16px clamp(20px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:20px}
.name{font-weight:700;font-size:17px;white-space:nowrap}
nav.top{display:flex;align-items:center;gap:clamp(12px,2.5vw,28px);font-size:14px;font-weight:500;white-space:nowrap}

.intro{max-width:1440px;margin:0 auto;padding:clamp(112px,14vw,168px) clamp(20px,4vw,48px) clamp(28px,3vw,44px);display:flex;flex-direction:column;gap:clamp(20px,2.4vw,32px)}
.back{font-size:14px;font-weight:500;color:#6E6370;align-self:flex-start}
h1{margin:0;font-family:'Familjen Grotesk',sans-serif;font-weight:600;font-size:clamp(44px,7.4vw,120px);line-height:.95;letter-spacing:-.03em}
.lead{margin:0;max-width:62ch;color:#6E6370}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump a{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid #CFC7BB;transition:border-color .2s,color .2s}
.jump a:hover{border-color:#E09723}
.lock{max-width:440px;display:flex;flex-direction:column;gap:14px}
.lock p{margin:0;color:#6E6370}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;height:48px;padding:0 16px;border:1px solid #CFC7BB;border-radius:999px;background:#fff;color:#37263A;font:inherit}
input:focus{outline:2px solid #E09723;outline-offset:1px;border-color:transparent}
.btn{height:48px;padding:0 22px;border:none;border-radius:999px;background:#37263A;color:#FAF8F4;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#E09723}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:#C07F14;font-size:14px;min-height:21px}
main{max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,48px) clamp(64px,8vw,120px);display:flex;flex-direction:column;gap:clamp(48px,6vw,88px)}
section.proj{display:flex;flex-direction:column;gap:20px;scroll-margin-top:90px}
.ph{border-top:1px solid #EAE5DC;padding-top:16px}
h2{margin:0;font-family:'Familjen Grotesk',sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,30px);letter-spacing:-.02em;line-height:1.15}
.rows{display:flex;flex-direction:column}
.r{display:flex}
.tile{display:block;flex:0 1 auto;min-width:0;padding:0;margin:0;border:none;border-radius:4px;overflow:hidden;background:#EFEAE2;cursor:zoom-in;position:relative}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.025)}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.shield{position:absolute;inset:0}
.about{display:grid;gap:clamp(20px,3vw,40px);align-items:start;padding:4px 0 0}
.about p{margin:0;font-size:14px;line-height:1.5;color:#6E6370;max-width:62ch}
.fact{display:flex;flex-direction:column;gap:3px;min-width:0}
.fact .l{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6E6370}
.fact .v{font-size:14px;line-height:1.45}
.fact .n{font-size:13px;color:#6E6370}
.fact a{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#E09723}
#lb{position:fixed;inset:0;z-index:100;background:rgba(26,18,30,.97);color:#FAF8F4;display:none;flex-direction:column}
#lb.open{display:flex}
.lbtop{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px clamp(12px,2vw,24px) 12px clamp(20px,3vw,32px)}
.lbtop span{font-size:14px;color:rgba(250,248,244,.7)}
.x{width:48px;height:48px;border:none;border-radius:50%;background:transparent;color:#FAF8F4;font-size:26px;line-height:1;cursor:pointer}
.x:hover{background:rgba(255,255,255,.1)}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 clamp(8px,6vw,96px)}
.stage .frame{position:relative;max-width:100%;max-height:100%;display:flex}
.stage img{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain;display:block;animation:lbIn .35s ease}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:#FAF8F4;font-size:22px;cursor:pointer;z-index:2}
.nav:hover{background:#E09723}
.prev{left:clamp(4px,1.5vw,24px)} .next{right:clamp(4px,1.5vw,24px)}
.lbcap{padding:16px clamp(20px,3vw,32px) 22px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.lbcap b{font-size:15px;font-weight:500} .lbcap span{font-size:13px;color:rgba(250,248,244,.7)}
@keyframes lbIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@media print{body *{visibility:hidden!important}}
@media (max-width:700px){.about{grid-template-columns:1fr!important;gap:6px}.about p{font-size:13px;margin-bottom:6px}.fact{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:10px;align-items:baseline}.fact .l{font-size:10px}.fact .v,.fact .n{font-size:13px}}
@media (max-width:560px){.name{font-size:15px}nav.top{font-size:13px;gap:12px}}
@media (max-width:400px){.bar{padding-left:16px;padding-right:16px;gap:10px}.name{font-size:14px}nav.top{font-size:12.5px;gap:9px}}
footer.lg{max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 28px}
.lgi{border-top:1px solid #EAE5DC;padding-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:14px;color:#6E6370}
.lgi a{color:#6E6370}
.hsoc{display:flex;align-items:center;gap:4px;margin-left:clamp(0px,1vw,8px)}.hsoc a{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;color:#37263A}.hsoc a:hover{background:rgba(128,128,128,.18)}@media (max-width:560px){.hsoc{display:none}}
header nav > a{transition:color .2s}header nav > a:hover,header nav > a:focus-visible{color:#E09723!important}
a.back{transition:color .2s}a.back:hover,a.back:focus-visible{color:#E09723!important}
</style>
